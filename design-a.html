<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonoCapsule V14</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle,#ffd6ec,#fff);font-family:"Press Start 2P",monospace;overflow:hidden}.wrap{text-align:center}.logo{margin-bottom:14px;color:#111}.logo .ascii{font-size:16px;line-height:1.2;white-space:pre}.logo .name{font-size:24px;margin-top:8px;letter-spacing:1px}.machine{width:520px}.head{height:160px;position:relative;display:flex}.ear{position:absolute;width:72px;height:72px;border-radius:50%;top:-34px;border:6px solid #111}.leftEar{left:8px;background:#fff}.rightEar{right:8px;background:#111}.half{flex:1;display:flex;align-items:center;justify-content:center;font-size:58px}.white{background:#fff;border:6px solid #111;border-right:3px solid #111;border-radius:90px 0 0 40px}.black{background:#111;color:#ff2da8;border:6px solid #111;border-left:3px solid #111;border-radius:0 90px 40px 0}.bodybox{background:#f6f6f6;padding:12px;border:6px solid #111;border-top:none;box-shadow:6px 6px 0 #111,12px 12px 0 #ff2da8}.screen{background:#000;color:#ff4db7;border:4px solid #111;padding:14px;font-size:12px}.window{height:150px;border:4px solid #111;background:#fff;margin:10px 0;display:flex;justify-content:center;align-items:center}.capsule{font-size:58px}.controls{display:flex;justify-content:center;gap:8px}.btn{font-family:inherit;font-size:10px;padding:10px;border:4px solid #111;cursor:pointer}.hope{background:#fff}.despair{background:#ff2da8;color:#fff}.mouth{width:200px;height:34px;background:#111;margin:12px auto 0;border-top:5px solid #ff2da8;border-radius:0 0 30px 30px;position:relative;transition:.25s}.mouth.open{height:60px}.teeth{color:#fff;padding-top:2px}.dropzone{height:120px;position:relative}.itemName{position:absolute;left:50%;transform:translateX(-50%);top:28px;font-size:10px;width:95%}.reward{position:absolute;left:50%;transform:translateX(-50%);font-size:44px;opacity:0;top:40px}.spit{animation:spit 1s forwards}@keyframes spit{0%{top:15px;opacity:0}30%{opacity:1}100%{top:52px;opacity:1}}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.floor{position:fixed;bottom:0;left:0;width:200%;height:44px;background:repeating-linear-gradient(90deg,#111 0 22px,#fff 22px 44px);animation:move 2s linear infinite}.floor:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff 0 22px,#111 22px 44px);transform:translateY(22px)}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-44px)}}</style></head><body><div class="wrap"><div class="logo"><div class="ascii">█▀▄▀█ █▀█ █▄ █ █▀█
█ ▀ █ █▄█ █ ▀█ █▄█</div><div class="name">MONOCAPSULE</div></div><div class="machine" id="machine"><div class="head"><div class="ear leftEar"></div><div class="ear rightEar"></div><div class="half white">◉</div><div class="half black">✹</div></div><div class="bodybox"><div class="screen" id="screen">HOPE OR DESPAIR?</div><div class="window"><div class="capsule">⚪😊⚫</div></div><div class="controls"><button class="btn hope" onclick="pick('hope')">INSERT HOPE</button><button class="btn despair" onclick="pick('despair')">PULL FOR DESPAIR</button></div><div class="mouth" id="mouth"><div class="teeth">▼ ▼ ▼ ▼ ▼</div></div><div class="dropzone"><div id="itemName" class="itemName"></div><div id="reward" class="reward">?</div></div></div></div></div><div class="floor"></div><script>const hope=[['🎮','GAME CARTRIDGE'],['🎹','PIANO KEY'],['⭐','HOPE FRAGMENT'],['👑','ROYAL CROWN'],['🕵️','DETECTIVE BADGE'],['🔑','MASTER KEY'],['📷','CAMERA'],['🪄','MAGIC WAND']];const despair=[['🧈','BUTTER BOX'],['🎲','CHECKER DICE'],['☘️','BROKEN CLOVER'],['🎭','MASK'],['⚫','DESPAIR FRAGMENT'],['🚀','ESCAPE ROCKET'],['🐹','DARK DEVAS'],['🎸','GUITAR PICK'],['☕','GOTHIC TEACUP']];function pick(t){const m=document.getElementById('machine');const s=document.getElementById('screen');const mouth=document.getElementById('mouth');const r=document.getElementById('reward');m.classList.add('shake');s.textContent=t==='hope'?'PROCESSING HOPE...':'PROCESSING DESPAIR...';setTimeout(()=>m.classList.remove('shake'),350);setTimeout(()=>{mouth.classList.add('open');let pool=t==='hope'?hope:despair;if(Math.random()<0.15){pool=t==='hope'?despair:hope;s.textContent='CHOICE IS AN ILLUSION';}else{s.textContent='COLLECTIBLE DISCOVERED';}const item=pool[Math.floor(Math.random()*pool.length)];itemName.textContent=item[1];r.textContent=item[0];r.classList.remove('spit');void r.offsetWidth;r.classList.add('spit');setTimeout(()=>mouth.classList.remove('open'),900);},700);}</script></body></html>
