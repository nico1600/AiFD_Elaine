<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commute Story</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Space Grotesk,sans-serif;background:#FF8DC7;color:#000080;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:linear-gradient(-45deg,#FFDBE9,#ffd1e3,#FFDBE9,#ffc4dc);background-size:400% 400%;animation:bg 14s ease infinite;z-index:-2}.hero img{width:100%;height:55vh;object-fit:cover;display:block}.container{max-width:1400px;margin:auto;padding:2rem}.title{text-align:center;font-family:Fredoka,sans-serif;color:#FFE566;font-size:2rem;margin-bottom:2rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;align-items:start}.card{background:rgba(255,255,255,.18);border:6px solid #FFE566;border-radius:30px;padding:18px;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.08);transition:transform .25s ease,box-shadow .25s ease;animation:bob 5s ease-in-out infinite}.card:hover{transform:translateY(-14px) rotate(-2deg) scale(1.03);box-shadow:0 0 0 4px rgba(255,229,102,.45),0 24px 40px rgba(0,0,0,.22)}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:4px solid #FFE566;margin-bottom:12px}.card h3{font-family:Fredoka,sans-serif;color:#FFE566}.shape{position:fixed;color:#FFE566;opacity:.7;z-index:-1;animation:float 18s linear infinite;font-size:2rem}@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shape" style="left:8%">✦</div><div class="shape" style="left:24%">●</div><div class="shape" style="left:42%">■</div><div class="shape" style="left:63%">✦</div><div class="shape" style="left:84%">●</div><section class="hero"><img src="hero.jpg" alt="Hero"></section><div class="container"><div class="title">Commute Story</div><div class="grid"><div class="card"><img src="commute/commute1.jpg"><h3>Elude</h3></div><div class="card"><img src="commute/commute2.jpg"><h3>Shinjuku Terrors</h3></div><div class="card"><img src="commute/commute3.jpg"><h3>Starry Railway</h3></div><div class="card"><img src="commute/commute4.jpg"><h3>Neverland</h3></div></div></div></body></html>
