<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mission Patch</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #FF8DC7;
      color: #000080;
      overflow-x: hidden;
    }
    body:before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(-45deg, #FF8DC7, #ffd1e3, #FF8DC7, #ffc4dc);
      background-size: 400% 400%;
      animation: bg 14s ease infinite;
      z-index: -2;
    }
    .hero img {
      width: 100%;
      height: 35vh;
      object-fit: cover;
      display: block;
    }
    .container {
      max-width: 1400px;
      margin: auto;
      padding: 2rem 2rem 4rem;
    }
    .title {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      color: #FFE566;
      font-size: 2.2rem;
      margin-bottom: 2rem;
      letter-spacing: 0.04em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      align-items: start;
    }
    .card {
      background: rgba(255, 255, 255, .18);
      border: 6px solid #FFE566;
      border-radius: 30px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, .08);
      transition: transform .25s ease, box-shadow .25s ease;
      animation: bob 5s ease-in-out infinite;
    }
    .card:hover {
      transform: translateY(-12px) rotate(-1.5deg) scale(1.02);
      box-shadow: 0 0 0 4px rgba(255, 229, 102, .45), 0 24px 40px rgba(0, 0, 0, .22);
    }
    .card-title-box {
      font-family: 'Fredoka', sans-serif;
      color: #000080;
      background: #FFE566;
      border-radius: 16px;
      padding: 8px 16px;
      margin-bottom: 14px;
      font-size: 1.15rem;
      font-weight: 600;
      display: inline-block;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    .card img {
      width: 100%;
      max-height: 480px;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 20px;
      border: 4px solid #FFE566;
      background: rgba(255, 255, 255, 0.25);
    }
    .shape {
      position: fixed;
      color: #FFE566;
      opacity: .7;
      z-index: -1;
      animation: float 18s linear infinite;
      font-size: 2rem;
      pointer-events: none;
    }
    @keyframes bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      from { transform: translateY(110vh) rotate(0); }
      to { transform: translateY(-120vh) rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .hero img {
        height: 25vh;
      }
    }
  </style>
</head>
<body>
  <div class="shape" style="left:8%">✦</div>
  <div class="shape" style="left:24%">●</div>
  <div class="shape" style="left:42%">■</div>
  <div class="shape" style="left:63%">✦</div>
  <div class="shape" style="left:84%">●</div>

  <section class="hero">
    <img src="hero.jpg" alt="Hero">
  </section>

  <div class="container">
    <div class="title">Mission Patch</div>
    <div class="grid">
      <div class="card">
        <div class="card-title-box">Visual Translation Game</div>
        <img src="missionpatch/patch1.jpeg" alt="Visual Translation Game">
      </div>
      <div class="card">
        <div class="card-title-box">Symbol Mapping</div>
        <img src="missionpatch/patch2.jpeg" alt="Symbol Mapping">
      </div>
      <div class="card">
        <div class="card-title-box">Rapid Concept Generation</div>
        <img src="missionpatch/patch3.jpeg" alt="Rapid Concept Generation">
      </div>
      <div class="card">
        <div class="card-title-box">Final Concept Sketch</div>
        <img src="missionpatch/patch4.jpeg" alt="Final Concept Sketch">
      </div>
    </div>
  </div>
</body>
</html>
